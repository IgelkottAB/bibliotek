<!doctype html>

<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Datorlås – Igelkotts Biblioteken</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <b>📚 IGELKOTTS BIBLIOTEKEN</b>
  <span>Datorlås</span>
</header>

<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<script src="app.js"></script>

<script>

const app = document.getElementById("app");
let staff = null;


/* =========================
   LOGIN
========================= */

function loginBox(){

  app.innerHTML = `
    <section class="panel">

      <h1>🔐 Personalinloggning</h1>

      <p>
        Logga in för att ändra datorernas låsstatus.
      </p>

      <div class="form">

        <input
          id="u"
          type="email"
          class="input"
          placeholder="E-post"
          autocomplete="username"
        >

        <input
          id="p"
          type="password"
          class="input"
          placeholder="Lösenord"
          autocomplete="current-password"
        >

        <button class="btn" onclick="login()">
          LOGGA IN
        </button>

        <div id="m" class="msg hidden"></div>

      </div>

    </section>
  `;
}


async function login(){

  try{

    const email =
      document.getElementById("u").value.trim();

    const password =
      document.getElementById("p").value;

    if(!email || !password){
      throw new Error("Fyll i e-post och lösenord.");
    }

    const {data,error} =
      await db.auth.signInWithPassword({
        email: email,
        password: password
      });

    if(error) throw error;


    /* Kontrollera rollen */

    const {data:profile,error:profileError} =
      await db
        .from("profiles")
        .select("id,full_name,role")
        .eq("id",data.user.id)
        .single();

    if(profileError) throw profileError;


    if(profile.role !== "personal"){

      await db.auth.signOut();

      throw new Error(
        "Det här kontot är inte ett personalkonto."
      );

    }


    staff = profile;

    show();

  }catch(e){

    msg(
      document.getElementById("m"),
      e.message,
      "error"
    );

  }

}


/* =========================
   KONTROLLERA SESSION
========================= */

async function checkStaff(){

  const {data,error} =
    await db.auth.getSession();

  if(error || !data.session){

    staff = null;
    loginBox();
    return;

  }


  const user =
    data.session.user;


  const {data:profile,error:profileError} =
    await db
      .from("profiles")
      .select("id,full_name,role")
      .eq("id",user.id)
      .single();


  if(
    profileError ||
    !profile ||
    profile.role !== "personal"
  ){

    await db.auth.signOut();

    staff = null;
    loginBox();

    return;

  }


  staff = profile;

  show();

}


/* =========================
   VISA DATORER
========================= */

async function show(){

  if(!staff){

    loginBox();
    return;

  }


  try{

    const {data,error} =
      await db
        .from("library_computers")
        .select("*")
        .order("computer_no");

    if(error) throw error;


    app.innerHTML = `

      <section class="panel">

        <div class="buttons">

          <h1 style="margin-right:auto">
            💻 Datorlås
          </h1>

          <button
            class="btn secondary"
            onclick="logout()"
          >
            Logga ut
          </button>

        </div>


        <p>
          Här ändrar personalen om bibliotekets
          lånedator ska vara öppen eller låst.
        </p>


        <div id="m" class="msg hidden"></div>


        <div class="grid">

          ${(data || []).map(c => `

            <div class="card">

              <span>💻</span>

              <b>
                Dator ${esc(c.computer_no)}
              </b>


              <span class="${
                c.locked
                  ? "status-locked"
                  : "status-open"
              }">

                ${
                  c.locked
                    ? "🔒 LÅST"
                    : "🟢 ÖPPEN"
                }

              </span>


              <button
                class="btn ${
                  c.locked
                    ? "green"
                    : "danger"
                }"
                onclick="toggle(
                  ${c.id},
                  ${!c.locked}
                )"
              >

                ${
                  c.locked
                    ? "LÅS UPP"
                    : "LÅS DATORN"
                }

              </button>

            </div>

          `).join("")}

        </div>

      </section>

    `;

  }catch(e){

    app.innerHTML = `

      <section class="panel">

        <div class="msg error">
          ${esc(e.message)}
        </div>

        <p>
          Kontrollera att tabellen
          library_computers finns i Supabase.
        </p>

      </section>

    `;

  }

}


/* =========================
   LÅS / LÅS UPP
========================= */

async function toggle(id,locked){

  const {error} =
    await db
      .from("library_computers")
      .update({locked})
      .eq("id",id);

  if(error){

    const m =
      document.getElementById("m");

    msg(m,error.message,"error");

    return;

  }

  show();

}


/* =========================
   LOGGA UT
========================= */

async function logout(){

  await db.auth.signOut();

  staff = null;

  loginBox();

}


/* =========================
   START
========================= */

checkStaff();

</script>

</body>
</html>
