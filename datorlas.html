<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Datorlås – Igelkotts Biblioteken</title><link rel="stylesheet" href="style.css"></head><body><header><b>📚 IGELKOTTS BIBLIOTEKEN</b><span>Datorlås</span></header><main id="app"></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const{createClient}=supabase,db=createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true}}),app=document.getElementById('app');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function init(){const{data:{session}}=await db.auth.getSession();if(!session)return loginBox();const{data:p,error}=await db.from('profiles').select('role').eq('id',session.user.id).single();if(error||p?.role!=='personal'){await db.auth.signOut();return loginBox('Du har inte behörighet.')}load()}function loginBox(e=''){app.innerHTML=`<section class="panel"><h1>💻 Datorlås</h1><div class="form"><input id="email" class="input" placeholder="E-post"><input id="password" class="input" type="password" placeholder="Lösenord"><button class="btn" onclick="login()">LOGGA IN</button><div id="m" class="msg ${e?'error':'hidden'}">${esc(e)}</div></div></section>`}async function login(){const{error}=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)document.getElementById('m').textContent=error.message;else init()}async function load(){const{data,error}=await db.from('library_computers').select('*').order('computer_no');if(error)return app.innerHTML=`<section class="panel"><div class="msg error">${esc(error.message)}</div></section>`;app.innerHTML=`<section class="panel"><div class="buttons"><h1 style="margin-right:auto">💻 Datorlås</h1><button class="btn secondary" onclick="logout()">Logga ut</button></div><div class="grid">${data.map(c=>`<div class="card">💻 <b>Lånedator ${c.computer_no}</b><small>${c.locked?'🔒 LÅST':'🟢 ÖPPEN'}</small><button class="btn ${c.locked?'secondary':''}" onclick="toggle(${c.id},${!c.locked})">${c.locked?'ÖPPNA':'LÅS'}</button></div>`).join('')}</div></section>`}async function toggle(id,v){const{error}=await db.from('library_computers').update({locked:v,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else load()}async function logout(){await db.auth.signOut();loginBox()}init();
</script></body></html>
