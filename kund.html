<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kundsida – Igelkotts Biblioteken</title><link rel="stylesheet" href="style.css"></head>
<body><header><b>📚 IGELKOTTS BIBLIOTEKEN</b><span>Kundsida</span></header><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script>
<script>
const app=document.getElementById("app");let member=getMember();
function loginBox(){app.innerHTML=`<section class="panel"><h1>Logga in</h1><p>Logga in med lånekortsnummer och personnummer.</p>
<div class="form"><input id="card" class="input" inputmode="numeric" placeholder="Lånekortsnummer">
<input id="pnr" class="input" inputmode="numeric" placeholder="Personnummer">
<button class="btn" onclick="login()">LOGGA IN</button><div id="m" class="msg hidden"></div></div></section>`}
async function show(){if(!member){loginBox();return}
try{const loans=await getMyLoans(member.id);app.innerHTML=`<section class="panel">
<div class="buttons"><h1 style="margin-right:auto">Hej ${esc(member.name)}!</h1><button class="btn secondary" onclick="logoutMember()">Logga ut</button></div>
<h2>📚 Mina lånade böcker</h2>${loans.length?loans.map(l=>`<div class="book"><strong>${esc(l.books?.title)}</strong>
<span>${esc(l.books?.author_initials||"")}</span><br><span>Förfaller: <b>${esc(l.due_date)}</b></span><br>
<span class="tag">Omlån använda: ${Number(l.renew_count||0)} / 2</span>
${Number(l.renew_count||0)<2?`<br><button class="btn secondary" onclick="renew(${l.id})">LÅNA OM</button>`:`<br><span class="dangerText">Kan inte lånas om fler gånger.</span>`}</div>`).join(""):"<p>Du har inga lånade böcker.</p>"}
<div id="m" class="msg hidden"></div></section>`}catch(e){app.innerHTML=`<section class="panel"><div class="msg error">${esc(e.message)}</div></section>`}}
async function login(){try{member=await memberLogin(card.value.trim(),pnr.value.trim());show()}catch(e){msg(document.getElementById("m"),e.message,"error")}}
async function renew(id){try{const r=await renewLoan(id,member.id);msg(document.getElementById("m"),"Boken är omlånad. Nytt förfallodatum: "+r.due_date,"success");show()}catch(e){msg(document.getElementById("m"),e.message,"error")}}
show();
</script></body></html>
