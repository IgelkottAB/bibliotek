<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Personal – Igelkotts Biblioteken</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <b>📚 IGELKOTTS BIBLIOTEKEN</b>
  <span>Personal</span>
</header>

<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>

<script>

const app = document.getElementById("app");

let staff = null;


/* =========================================================
   LOGIN
========================================================= */

function loginBox(){

  app.innerHTML = `

  <section class="panel">

    <h1>🧑‍💼 Personal</h1>

    <p>
      Logga in med bibliotekets personalkonto.
    </p>

    <div class="form">

      <input
        id="email"
        class="input"
        type="email"
        placeholder="E-post"
        autocomplete="username"
      >

      <input
        id="password"
        class="input"
        type="password"
        placeholder="Lösenord"
        autocomplete="current-password"
      >

      <button class="btn" onclick="login()">
        LOGGA IN
      </button>

      <div id="loginMessage" class="msg hidden"></div>

    </div>

  </section>

  `;

}


/* =========================================================
   LOGGA IN
========================================================= */

async function login(){

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const message = document.getElementById("loginMessage");

  try{

    if(!email || !password){
      throw new Error("Fyll i e-post och lösenord.");
    }

    const {data,error} =
      await db.auth.signInWithPassword({
        email,
        password
      });

    if(error) throw error;

    const {data:profile,error:profileError} =
      await db
        .from("profiles")
        .select("id,full_name,role")
        .eq("id",data.user.id)
        .single();

    if(profileError) throw profileError;

    if(profile.role !== "personal"){

      await db.auth.signOut();

      throw new Error(
        "Det här kontot är inte ett personalkonto."
      );

    }

    staff = profile;

    render();

  }catch(e){

    msg(
      message,
      e.message,
      "error"
    );

  }

}


/* =========================================================
   KONTROLLERA INLOGGNING
========================================================= */

async function checkStaff(){

  const {data} = await db.auth.getSession();

  if(!data.session){

    loginBox();

    return false;

  }

  const {data:profile,error} =
    await db
      .from("profiles")
      .select("id,full_name,role")
      .eq("id",data.session.user.id)
      .single();

  if(error || !profile || profile.role !== "personal"){

    await db.auth.signOut();

    loginBox();

    return false;

  }

  staff = profile;

  return true;

}


/* =========================================================
   LOGGA UT
========================================================= */

async function logout(){

  await db.auth.signOut();

  staff = null;

  loginBox();

}


/* =========================================================
   HUVUDSIDAN
========================================================= */

async function render(){

  app.innerHTML = `

  <section class="panel">

    <div class="buttons">

      <div style="margin-right:auto">

        <h1 style="margin:0">
          🧑‍💼 Personal
        </h1>

        <p class="muted">
          Inloggad som ${esc(staff.full_name || "Bibliotekspersonal")}
        </p>

      </div>

      <button class="btn secondary" onclick="logout()">
        LOGGA UT
      </button>

    </div>

  </section>


  <!-- =====================================================
       NY LÅNTAGARE
  ====================================================== -->

  <section class="panel">

    <h2>➕ Ny låntagare</h2>

    <p class="muted">
      Skapa ett nytt lånekort.
      Skanna streckkoden med Netum-skannern i fältet för lånekortsnummer.
    </p>

    <div class="form">

      <label>
        Namn
        <input
          id="newName"
          class="input"
          type="text"
          placeholder="För- och efternamn"
        >
      </label>


      <label>
        Personnummer
        <input
          id="newPersonnummer"
          class="input"
          type="text"
          inputmode="numeric"
          placeholder="ÅÅMMDDNNNN"
        >
      </label>


      <label>
        Lånekortsnummer / streckkod
        <input
          id="newCard"
          class="input"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          placeholder="Skanna streckkoden här"
        >
      </label>


      <label>
        E-post
        <input
          id="newEmail"
          class="input"
          type="email"
          placeholder="Valfritt"
        >
      </label>


      <label>
        Telefon
        <input
          id="newPhone"
          class="input"
          type="tel"
          placeholder="Valfritt"
        >
      </label>


      <button class="btn" onclick="createMember()">
        SKAPA LÅNEKORT
      </button>


      <div id="memberMessage" class="msg hidden"></div>

    </div>

  </section>


  <!-- =====================================================
       BOKSÖKNING
  ====================================================== -->

  <section class="panel">

    <h2>🔎 Sök bok</h2>

    <div class="form">

      <input
        id="bookBarcode"
        class="input"
        type="text"
        inputmode="numeric"
        placeholder="Skanna eller skriv streckkod"
        autocomplete="off"
      >

      <button class="btn secondary" onclick="searchBook()">
        SÖK
      </button>

      <div id="bookMessage" class="msg hidden"></div>

      <div id="bookResult"></div>

    </div>

  </section>


  <!-- =====================================================
       LÄGG TILL BOK
  ====================================================== -->

  <section class="panel">

    <h2>📚 Lägg till bok</h2>

    <div class="form">

      <input
        id="addBarcode"
        class="input"
        type="text"
        inputmode="numeric"
        placeholder="Streckkod"
      >

      <input
        id="addTitle"
        class="input"
        type="text"
        placeholder="Boktitel"
      >

      <input
        id="addAuthor"
        class="input"
        type="text"
        placeholder="Författarinitialer"
      >

      <input
        id="addShelf"
        class="input"
        type="text"
        placeholder="Hylla"
      >

      <input
        id="addAisle"
        class="input"
        type="text"
        placeholder="Gång"
      >

      <button class="btn" onclick="addBook()">
        LÄGG TILL BOK
      </button>

      <div id="addBookMessage" class="msg hidden"></div>

    </div>

  </section>


  <!-- =====================================================
       AKTIVA LÅN
  ====================================================== -->

  <section class="panel">

    <div class="buttons">

      <h2 style="margin-right:auto">
        📖 Aktiva lån
      </h2>

      <button
        class="btn secondary"
        onclick="loadLoans()"
      >
        UPPDATERA
      </button>

    </div>

    <div id="loansResult">
      Laddar...
    </div>

  </section>


  <!-- =====================================================
       DATORLÅS
  ====================================================== -->

  <section class="panel">

    <h2>💻 Lånedatorer</h2>

    <p>
      Hantera bibliotekets lånedatorer.
    </p>

    <a
      class="btn"
      href="datorlas.html"
      style="display:inline-block;text-decoration:none"
    >
      ÖPPNA DATORLÅS
    </a>

  </section>

  `;


  loadLoans();

}


/* =========================================================
   SKAPA NY LÅNTAGARE
========================================================= */

async function createMember(){

  const name =
    document.getElementById("newName").value.trim();

  const personnummer =
    document.getElementById("newPersonnummer").value.trim();

  const card =
    document.getElementById("newCard").value.trim();

  const email =
    document.getElementById("newEmail").value.trim();

  const phone =
    document.getElementById("newPhone").value.trim();

  const message =
    document.getElementById("memberMessage");


  try{

    if(!name){
      throw new Error("Fyll i namn.");
    }

    if(!personnummer){
      throw new Error("Fyll i personnummer.");
    }

    if(!card){
      throw new Error(
        "Skanna lånekortets streckkod."
      );
    }


    const {data,error} =
      await db.rpc(
        "create_library_member",
        {
          p_name: name,
          p_card_number: card,
          p_personnummer: personnummer,
          p_email: email || null,
          p_phone: phone || null
        }
      );


    if(error) throw error;


    msg(
      message,
      "Låntagaren skapades! Lånekortsnummer: " + card,
      "success"
    );


    document.getElementById("newName").value = "";
    document.getElementById("newPersonnummer").value = "";
    document.getElementById("newCard").value = "";
    document.getElementById("newEmail").value = "";
    document.getElementById("newPhone").value = "";


  }catch(e){

    msg(
      message,
      e.message,
      "error"
    );

  }

}


/* =========================================================
   SÖK BOK
========================================================= */

async function searchBook(){

  const barcode =
    document.getElementById("bookBarcode")
      .value.trim();

  const message =
    document.getElementById("bookMessage");

  const result =
    document.getElementById("bookResult");


  try{

    if(!barcode){
      throw new Error(
        "Skanna eller skriv en streckkod."
      );
    }


    const book =
      await findBook(barcode);


    if(!book){

      result.innerHTML = `
        <div class="msg error">
          Ingen bok hittades med den streckkoden.
        </div>
      `;

      return;

    }


    result.innerHTML = `

      <div class="book">

        <strong>
          ${esc(book.title)}
        </strong>

        <br>

        <span>
          Författarinitialer:
          ${esc(book.author_initials || "-")}
        </span>

        <br>

        <span>
          Hylla:
          ${esc(book.shelf || "-")}
        </span>

        <br>

        <span>
          Gång:
          ${esc(book.aisle || "-")}
        </span>

        <br>

        <span class="tag">
          ${book.available ? "Tillgänglig" : "Utlånad"}
        </span>

      </div>

    `;


    message.className = "msg hidden";


  }catch(e){

    msg(
      message,
      e.message,
      "error"
    );

  }

}


/* =========================================================
   LÄGG TILL BOK
========================================================= */

async function addBook(){

  const barcode =
    document.getElementById("addBarcode")
      .value.trim();

  const title =
    document.getElementById("addTitle")
      .value.trim();

  const author =
    document.getElementById("addAuthor")
      .value.trim();

  const shelf =
    document.getElementById("addShelf")
      .value.trim();

  const aisle =
    document.getElementById("addAisle")
      .value.trim();

  const message =
    document.getElementById("addBookMessage");


  try{

    if(!barcode){
      throw new Error("Fyll i streckkod.");
    }

    if(!title){
      throw new Error("Fyll i boktitel.");
    }


    const {error} =
      await db
        .from("books")
        .insert({
          barcode,
          title,
          author_initials: author || null,
          shelf: shelf || null,
          aisle: aisle || null,
          available: true
        });


    if(error) throw error;


    msg(
      message,
      "Boken har lagts till.",
      "success"
    );


    document.getElementById("addBarcode").value = "";
    document.getElementById("addTitle").value = "";
    document.getElementById("addAuthor").value = "";
    document.getElementById("addShelf").value = "";
    document.getElementById("addAisle").value = "";


  }catch(e){

    msg(
      message,
      e.message,
      "error"
    );

  }

}


/* =========================================================
   VISA AKTIVA LÅN
========================================================= */

async function loadLoans(){

  const result =
    document.getElementById("loansResult");

  if(!result) return;


  result.innerHTML = "Laddar...";


  try{

    const {data,error} =
      await db
        .from("loans")
        .select(`
          id,
          barcode,
          borrowed_at,
          due_date,
          renew_count,
          members(name,card_number),
          books(title,author_initials)
        `)
        .is("returned_at",null)
        .order("due_date");


    if(error) throw error;


    if(!data?.length){

      result.innerHTML =
        "<p>Det finns inga aktiva lån.</p>";

      return;

    }


    result.innerHTML = data.map(l => `

      <div class="book">

        <strong>
          ${esc(l.books?.title || "Okänd bok")}
        </strong>

        <br>

        <span>
          Låntagare:
          ${esc(l.members?.name || "-")}
        </span>

        <br>

        <span>
          Lånekort:
          ${esc(l.members?.card_number || "-")}
        </span>

        <br>

        <span>
          Förfaller:
          <b>${esc(l.due_date)}</b>
        </span>

        <br>

        <span class="tag">
          Omlån: ${Number(l.renew_count || 0)} / 2
        </span>

      </div>

    `).join("");


  }catch(e){

    result.innerHTML = `

      <div class="msg error">
        ${esc(e.message)}
      </div>

    `;

  }

}


/* =========================================================
   START
========================================================= */

checkStaff().then(ok => {

  if(ok){
    render();
  }

});


</script>

</body>
</html>
