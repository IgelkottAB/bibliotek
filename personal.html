<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal – Igelkotts Biblioteken</title><link rel="stylesheet" href="style.css"></head><body><header><b>📚 IGELKOTTS BIBLIOTEKEN</b><span>Personal</span></header><main id="app"></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script>
const app=document.getElementById('app');async function init(){const{data:{session}}=await db.auth.getSession();if(!session)return loginBox();const{data:p,error}=await db.from('profiles').select('*').eq('id',session.user.id).single();if(error||p?.role!=='personal'){await db.auth.signOut();return loginBox('Du har inte behörighet som personal.')}render()}
function loginBox(e=''){app.innerHTML=`<section class="panel"><h1>🧑‍💼 Personal</h1><div class="form"><input id="email" class="input" type="email" placeholder="E-post"><input id="password" class="input" type="password" placeholder="Lösenord"><button class="btn" onclick="login()">LOGGA IN</button><div id="m" class="msg ${e?'error':'hidden'}">${esc(e)}</div></div></section>`}async function login(){const{error}=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)msg(document.getElementById('m'),error.message,'error');else init()}
function render(){app.innerHTML=`<section class="panel"><div class="buttons"><h1 style="margin-right:auto">🧑‍💼 Personal</h1><button class="btn secondary" onclick="logout()">Logga ut</button></div><div class="grid"><button class="card" onclick="books()">📖 <b>BÖCKER</b><small>Lägg till bok</small></button><button class="card" onclick="members()">👤 <b>LÅNTAGARE</b><small>Skapa lånekort</small></button></div><div id="work"></div></section>`}
function books(){work.innerHTML=`<div class="panel"><h2>📖 Ny bok</h2><div class="form"><input id="bc" class="input" placeholder="Streckkod"><input id="bt" class="input" placeholder="Titel"><input id="ba" class="input" placeholder="Författarinitialer"><input id="bs" class="input" placeholder="Hyllplan"><input id="bi" class="input" placeholder="Gång"><button class="btn" onclick="saveBook()">SPARA BOK</button><div id="bm" class="msg hidden"></div></div></div>`}async function saveBook(){const{error}=await db.from('books').insert({barcode:bc.value.trim(),title:bt.value.trim(),author_initials:ba.value.trim(),shelf:bs.value.trim(),aisle:bi.value.trim(),available:true});msg(document.getElementById('bm'),error?error.message:'Boken sparades.',error?'error':'success')}
function members(){work.innerHTML=`<div class="panel"><h2>➕ Ny låntagare</h2><div class="form"><input id="mn" class="input" placeholder="Namn"><input id="mp" class="input" inputmode="numeric" placeholder="Personnummer"><input id="mc" class="input" inputmode="numeric" placeholder="Lånekortsnummer"><input id="me" class="input" type="email" placeholder="E-post (valfritt)"><input id="mt" class="input" placeholder="Telefon, t.ex. +46701234567 (valfritt)"><button class="btn" onclick="saveMember()">SKAPA LÅNTAGARE</button><div id="mm" class="msg hidden"></div></div></div>`}async function saveMember(){const{error}=await db.rpc('create_library_member',{p_name:mn.value.trim(),p_card_number:mc.value.trim(),p_personnummer:mp.value.trim(),p_email:me.value.trim()||null,p_phone:mt.value.trim()||null});msg(document.getElementById('mm'),error?error.message:'Låntagaren skapades.',error?'error':'success')}async function logout(){await db.auth.signOut();loginBox()}init();
</script></body></html>
