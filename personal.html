<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Personal – Igelkotts Biblioteken</title><link rel="stylesheet" href="style.css"></head>
<body><header><b>📚 IGELKOTTS BIBLIOTEKEN</b><span>Personal</span></header><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script>
<script>
const app=document.getElementById("app");let staff=localStorage.getItem("library_staff");
function loginBox(){app.innerHTML=`<section class="panel"><h1>Personalinloggning</h1><div class="form">
<input id="u" class="input" placeholder="Användarnamn"><input id="p" type="password" class="input" placeholder="Lösenord">
<button class="btn" onclick="login()">LOGGA IN</button><div id="m" class="msg hidden"></div></div></section>`}
async function login(){try{const {data,error}=await db.rpc("library_staff_login",{p_username:u.value.trim(),p_password:p.value});if(error)throw error;if(!data?.length)throw new Error("Fel användarnamn eller lösenord.");localStorage.setItem("library_staff",JSON.stringify(data[0]));staff=data[0];render()}catch(e){msg(document.getElementById("m"),e.message,"error")}}
function render(){if(!staff){loginBox();return}app.innerHTML=`<div class="buttons"><h1 style="margin-right:auto">Personal</h1><button class="btn secondary" onclick="logout()">Logga ut</button></div>
<div class="grid"><section class="panel"><h2>📟 Skanna en bok</h2><p>Använd Netum-skannern. Här kan du söka efter en bok med streckkod.</p>
<div class="form"><input id="searchbc" class="input barcode" placeholder="Skanna streckkod" onkeydown="if(event.key==='Enter')searchBook()"><button class="btn" onclick="searchBook()">SÖK</button></div><div id="result"></div></section>
<section class="panel"><h2>➕ Lägg till bok</h2><div class="form"><input id="bc" class="input barcode" placeholder="Streckkod"><input id="title" class="input" placeholder="Titel">
<input id="author" class="input" placeholder="Författarinitialer"><input id="shelf" class="input" placeholder="Hyllplan"><input id="aisle" class="input" placeholder="Gång">
<button class="btn green" onclick="add()">LÄGG TILL BOK</button><div id="am" class="msg hidden"></div></div></section>
<section class="panel"><h2>📋 Aktiva lån</h2><button class="btn" onclick="loans()">VISA UTLÅN</button><div id="out"></div></section>
<section class="panel"><h2>💻 Datorer</h2><p>Öppna sidan för att låsa eller låsa upp bibliotekets lånedatorer.</p><a class="btn" href="datorlas.html">ÖPPNA DATORLÅS</a></section></div>`}
function logout(){localStorage.removeItem("library_staff");staff=null;render()}
async function searchBook(){try{const b=await findBook(searchbc.value.trim());if(!b){result.innerHTML='<div class="msg error">Boken hittades inte.</div>';return}
result.innerHTML=`<div class="book"><strong>${esc(b.title)}</strong><span>${esc(b.author_initials||"")}</span><br>Streckkod: <span class="barcode">${esc(b.barcode)}</span><br>Hyllplan: ${esc(b.shelf||"-")} · ${esc(b.aisle||"-")}<br>Status: <b>${b.available?"Ledig":"Utlånad"}</b></div>`}catch(e){result.innerHTML=`<div class="msg error">${esc(e.message)}</div>`}}
async function loans(){try{const {data,error}=await db.from("loans").select("id,barcode,borrowed_at,due_date,members(name,card_number),books(title,author_initials)").is("returned_at",null).order("due_date");if(error)throw error;
out.innerHTML=`<table><tr><th>Bok</th><th>Låntagare</th><th>Kort</th><th>Förfaller</th></tr>${(data||[]).map(x=>`<tr><td>${esc(x.books?.title)}</td><td>${esc(x.members?.name)}</td><td>${esc(x.members?.card_number)}</td><td>${esc(x.due_date)}</td></tr>`).join("")}</table>`}catch(e){out.innerHTML=`<div class="msg error">${esc(e.message)}</div>`}}
async function add(){try{const {error}=await db.from("books").insert({barcode:bc.value.trim(),title:title.value.trim(),author_initials:author.value.trim(),shelf:shelf.value.trim(),aisle:aisle.value.trim(),available:true});if(error)throw error;
msg(am,"Boken är tillagd.","success");bc.value=title.value=author.value=shelf.value=aisle.value=""}catch(e){msg(am,e.message,"error")}}
render();
</script></body></html>
