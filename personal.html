<!doctype html>

<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Personal – Igelkotts Biblioteken</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <b>📚 IGELKOTTS BIBLIOTEKEN</b>
  <span>Personal</span>
</header>

<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<script src="app.js"></script>

<script>
const app = document.getElementById("app");
let staff = null;

/* =========================
   PERSONALINLOGGNING
========================= */

function loginBox(){
  app.innerHTML = `
    <section class="panel">
      <h1>Personalinloggning</h1>

      <div class="form">
        <input
          id="u"
          type="email"
          class="input"
          placeholder="E-post"
          autocomplete="username"
        >

        <input
          id="p"
          type="password"
          class="input"
          placeholder="Lösenord"
          autocomplete="current-password"
        >

        <button class="btn" onclick="login()">
          LOGGA IN
        </button>

        <div id="m" class="msg hidden"></div>
      </div>
    </section>
  `;
}

async function login(){
  try{
    const email = document.getElementById("u").value.trim();
    const password = document.getElementById("p").value;

    if(!email || !password){
      throw new Error("Fyll i e-post och lösenord.");
    }

    const {data,error} = await db.auth.signInWithPassword({
      email: email,
      password: password
    });

    if(error) throw error;

    const {data:profile,error:profileError} = await db
      .from("profiles")
      .select("id,full_name,role")
      .eq("id",data.user.id)
      .single();

    if(profileError) throw profileError;

    if(profile.role !== "personal"){
      await db.auth.signOut();
      throw new Error("Det här kontot är inte ett personalkonto.");
    }

    staff = profile;

    render();

  }catch(e){
    msg(
      document.getElementById("m"),
      e.message,
      "error"
    );
  }
}

/* =========================
   LOGGA UT
========================= */

async function logout(){
  await db.auth.signOut();
  staff = null;
  render();
}

/* =========================
   KONTROLLERA INLOGGNING
========================= */

async function checkStaff(){

  const {data,error} = await db.auth.getSession();

  if(error || !data.session){
    staff = null;
    loginBox();
    return;
  }

  const user = data.session.user;

  const {data:profile,error:profileError} = await db
    .from("profiles")
    .select("id,full_name,role")
    .eq("id",user.id)
    .single();

  if(profileError || !profile || profile.role !== "personal"){
    await db.auth.signOut();
    staff = null;
    loginBox();
    return;
  }

  staff = profile;
  render();
}

/* =========================
   PERSONALSIDAN
========================= */

function render(){

  if(!staff){
    loginBox();
    return;
  }

  app.innerHTML = `
    <div class="buttons">
      <h1 style="margin-right:auto">
        Personal
      </h1>

      <button class="btn secondary" onclick="logout()">
        Logga ut
      </button>
    </div>

    <div class="grid">

      <section class="panel">
        <h2>📟 Skanna en bok</h2>

        <p>
          Använd Netum-skannern.
          Här kan du söka efter en bok med streckkod.
        </p>

        <div class="form">

          <input
            id="searchbc"
            class="input barcode"
            placeholder="Skanna streckkod"
            onkeydown="if(event.key==='Enter')searchBook()"
          >

          <button class="btn" onclick="searchBook()">
            SÖK
          </button>

        </div>

        <div id="result"></div>
      </section>


      <section class="panel">

        <h2>➕ Lägg till bok</h2>

        <div class="form">

          <input
            id="bc"
            class="input barcode"
            placeholder="Streckkod"
          >

          <input
            id="title"
            class="input"
            placeholder="Titel"
          >

          <input
            id="author"
            class="input"
            placeholder="Författarinitialer"
          >

          <input
            id="shelf"
            class="input"
            placeholder="Hyllplan"
          >

          <input
            id="aisle"
            class="input"
            placeholder="Gång"
          >

          <button
            class="btn green"
            onclick="add()"
          >
            LÄGG TILL BOK
          </button>

          <div id="am" class="msg hidden"></div>

        </div>

      </section>


      <section class="panel">

        <h2>📋 Aktiva lån</h2>

        <button
          class="btn"
          onclick="loans()"
        >
          VISA UTLÅN
        </button>

        <div id="out"></div>

      </section>


      <section class="panel">

        <h2>💻 Datorer</h2>

        <p>
          Öppna sidan för att låsa eller låsa upp
          bibliotekets lånedatorer.
        </p>

        <a
          class="btn"
          href="datorlas.html"
        >
          ÖPPNA DATORLÅS
        </a>

      </section>

    </div>
  `;
}


/* =========================
   SÖK BOK
========================= */

async function searchBook(){

  try{

    const barcode =
      document.getElementById("searchbc").value.trim();

    if(!barcode){
      throw new Error("Skanna eller skriv in en streckkod.");
    }

    const b = await findBook(barcode);

    if(!b){

      result.innerHTML =
        '<div class="msg error">Boken hittades inte.</div>';

      return;
    }

    result.innerHTML = `
      <div class="book">

        <strong>${esc(b.title)}</strong>

        <span>
          ${esc(b.author_initials || "")}
        </span>

        <br>

        Streckkod:
        <span class="barcode">
          ${esc(b.barcode)}
        </span>

        <br>

        Hyllplan:
        ${esc(b.shelf || "-")}

        ·

        ${esc(b.aisle || "-")}

        <br>

        Status:
        <b>
          ${b.available ? "Ledig" : "Utlånad"}
        </b>

      </div>
    `;

  }catch(e){

    document.getElementById("result").innerHTML =
      `<div class="msg error">${esc(e.message)}</div>`;

  }
}


/* =========================
   VISA AKTIVA LÅN
========================= */

async function loans(){

  try{

    const {data,error} = await db
      .from("loans")
      .select(`
        id,
        barcode,
        borrowed_at,
        due_date,
        members(name,card_number),
        books(title,author_initials)
      `)
      .is("returned_at",null)
      .order("due_date");

    if(error) throw error;

    document.getElementById("out").innerHTML = `
      <table>

        <tr>
          <th>Bok</th>
          <th>Låntagare</th>
          <th>Kort</th>
          <th>Förfaller</th>
        </tr>

        ${(data || []).map(x => `
          <tr>

            <td>
              ${esc(x.books?.title)}
            </td>

            <td>
              ${esc(x.members?.name)}
            </td>

            <td>
              ${esc(x.members?.card_number)}
            </td>

            <td>
              ${esc(x.due_date)}
            </td>

          </tr>
        `).join("")}

      </table>
    `;

  }catch(e){

    document.getElementById("out").innerHTML =
      `<div class="msg error">${esc(e.message)}</div>`;

  }
}


/* =========================
   LÄGG TILL BOK
========================= */

async function add(){

  try{

    const barcode =
      document.getElementById("bc").value.trim();

    const titleValue =
      document.getElementById("title").value.trim();

    const authorValue =
      document.getElementById("author").value.trim();

    const shelfValue =
      document.getElementById("shelf").value.trim();

    const aisleValue =
      document.getElementById("aisle").value.trim();

    if(!barcode || !titleValue){
      throw new Error("Fyll i minst streckkod och titel.");
    }

    const {error} = await db
      .from("books")
      .insert({
        barcode: barcode,
        title: titleValue,
        author_initials: authorValue,
        shelf: shelfValue,
        aisle: aisleValue,
        available: true
      });

    if(error) throw error;

    msg(
      document.getElementById("am"),
      "Boken är tillagd.",
      "success"
    );

    document.getElementById("bc").value = "";
    document.getElementById("title").value = "";
    document.getElementById("author").value = "";
    document.getElementById("shelf").value = "";
    document.getElementById("aisle").value = "";

  }catch(e){

    msg(
      document.getElementById("am"),
      e.message,
      "error"
    );

  }
}


/* =========================
   STARTA
========================= */

checkStaff();

</script>

</body>
</html>
