<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lånedator – Igelkotts Biblioteken</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <b>📚 IGELKOTTS BIBLIOTEKEN</b>
  <span>Lånedator</span>
</header>

<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>

<script>

const app = document.getElementById("app");

let member = null;
let mode = null;
let items = [];


/* =========================================================
   STARTSIDA
========================================================= */

function home(){

  member = null;
  mode = null;
  items = [];

  app.innerHTML = `

    <section class="panel">

      <h1>Vad vill du göra?</h1>

      <div class="grid">

        <button class="card" onclick="start('borrow')">
          <span>📚</span>
          <b>LÅNA</b>
          <small>
            Skanna böcker med Netum-skannern
          </small>
        </button>

        <button class="card" onclick="start('return')">
          <span>📥</span>
          <b>LÄMNA TILLBAKA</b>
          <small>
            Skanna böcker du lämnar
          </small>
        </button>

      </div>

    </section>

  `;

}


/* =========================================================
   VÄLJ LÅNA / ÅTERLÄMNA
========================================================= */

function start(m){

  mode = m;
  items = [];

  app.innerHTML = `

    <section class="panel">

      <h1>
        ${m === "borrow"
          ? "Låna böcker"
          : "Lämna tillbaka böcker"}
      </h1>

      <div class="form">

        <input
          id="card"
          class="input"
          inputmode="numeric"
          autocomplete="off"
          placeholder="Lånekortsnummer"
        >

        <input
          id="pnr"
          class="input"
          inputmode="numeric"
          autocomplete="off"
          placeholder="Personnummer"
        >

        <button class="btn" onclick="login()">
          FORTSÄTT
        </button>

        <button
          class="btn secondary"
          onclick="home()"
        >
          TILLBAKA
        </button>

        <div id="m" class="msg hidden"></div>

      </div>

    </section>

  `;

  document.getElementById("card").focus();

}


/* =========================================================
   LOGIN
========================================================= */

async function login(){

  try{

    const card =
      document.getElementById("card")
        .value.trim();

    const pnr =
      document.getElementById("pnr")
        .value.trim();

    member =
      await memberLogin(card, pnr);

    scanPage();

  }catch(e){

    msg(
      document.getElementById("m"),
      e.message,
      "error"
    );

  }

}


/* =========================================================
   SKANNING
========================================================= */

function scanPage(){

  app.innerHTML = `

    <section class="panel">

      <h1>
        ${mode === "borrow"
          ? "Skanna böcker"
          : "Skanna böcker som ska lämnas"}
      </h1>

      <div class="notice">
        📟 <b>Använd Netum-skannern.</b>
        Klicka i rutan och skanna streckkoden.
      </div>

      <div class="form">

        <input
          id="barcode"
          class="input barcode"
          autocomplete="off"
          autofocus
          placeholder="Skanna streckkod här"
        >

        <button class="btn" onclick="addBook()">
          LÄGG TILL
        </button>

        <button
          class="btn secondary"
          onclick="finish()"
        >
          KLAR
        </button>

        <button
          class="btn secondary"
          onclick="home()"
        >
          AVBRYT
        </button>

      </div>

      <div id="m" class="msg hidden"></div>

      <div id="list"></div>

    </section>

  `;

  const input =
    document.getElementById("barcode");

  input.focus();

  input.addEventListener("keydown", e => {

    if(e.key === "Enter"){

      e.preventDefault();

      addBook();

    }

  });

}


/* =========================================================
   LÄGG TILL BOK
========================================================= */

async function addBook(){

  const input =
    document.getElementById("barcode");

  const b = input.value.trim();

  if(!b) return;

  try{

    const book = await findBook(b);

    if(!book)
      throw new Error("Boken hittades inte.");

    if(items.some(x => x.barcode === b))
      throw new Error("Boken är redan tillagd.");

    if(
      mode === "borrow" &&
      !book.available
    ){
      throw new Error(
        "Boken är redan utlånad."
      );
    }

    items.push(book);

    input.value = "";

    input.focus();

    renderList();

    msg(
      document.getElementById("m"),
      "Boken lades till.",
      "success"
    );

  }catch(e){

    msg(
      document.getElementById("m"),
      e.message,
      "error"
    );

    input.select();

  }

}


/* =========================================================
   LISTA
========================================================= */

function renderList(){

  document.getElementById("list").innerHTML =
    items.map((b,i) => `

      <div class="book">

        <strong>
          ${esc(b.title)}
        </strong>

        <span>
          ${esc(b.author_initials || "")}
        </span>

        ${
          mode === "borrow"
          ?
          `<br>
           <span class="muted">
             Hyllplan ${esc(b.shelf || "-")}
             · ${esc(b.aisle || "-")}
           </span>`
          :
          `<br>
           <span>
             Lägg boken i återlämningslådan.
           </span>`
        }

        <br>

        <button
          class="btn secondary"
          onclick="
            items.splice(${i},1);
            renderList();
            document.getElementById('barcode').focus();
          "
        >
          TA BORT
        </button>

      </div>

    `).join("");

}


/* =========================================================
   KVITTOVAL
========================================================= */

function receiptChoice(resultItems){

  const hasEmail =
    !!member.email;

  const hasPhone =
    !!member.phone;

  app.innerHTML = `

    <section class="panel">

      <h1>🧾 Kvittot är klart</h1>

      <p>
        Vill du få kvittot skickat?
      </p>

      <div class="book">

        <strong>
          ${esc(member.name)}
        </strong>

        <br>

        Lånekort:
        ${esc(member.card_number)}

        ${
          hasEmail
          ? `<br>📧 ${esc(member.email)}`
          : ""
        }

        ${
          hasPhone
          ? `<br>📱 ${esc(member.phone)}`
          : ""
        }

      </div>


      <div class="form">

        ${
          hasEmail
          ?
          `<button
            class="btn"
            onclick='sendReceiptNow("email", ${JSON.stringify(resultItems)})'
          >
            📧 SKICKA VIA E-POST
          </button>`
          :
          `<button class="btn secondary" disabled>
            📧 Ingen e-post registrerad
          </button>`
        }


        ${
          hasPhone
          ?
          `<button
            class="btn"
            onclick='sendReceiptNow("sms", ${JSON.stringify(resultItems)})'
          >
            📱 SKICKA VIA SMS
          </button>`
          :
          `<button class="btn secondary" disabled>
            📱 Inget telefonnummer registrerat
          </button>`
        }


        <button
          class="btn secondary"
          onclick="home()"
        >
          NEJ TACK
        </button>

        <div id="receiptMessage" class="msg hidden"></div>

      </div>

    </section>

  `;

}


async function sendReceiptNow(channel, resultItems){

  const message =
    document.getElementById("receiptMessage");

  try{

    msg(
      message,
      "Skickar kvittot...",
      ""
    );

    await sendReceipt(
      channel,
      mode,
      resultItems
    );

    msg(
      message,
      channel === "sms"
        ? "Kvitto skickat via SMS."
        : "Kvitto skickat via e-post.",
      "success"
    );

    setTimeout(home, 1800);

  }catch(e){

    msg(
      message,
      e.message,
      "error"
    );

  }

}


/* =========================================================
   SLUTFÖR
========================================================= */

async function finish(){

  if(!items.length){

    alert(
      "Du har inte lagt till någon bok."
    );

    return;

  }

  try{

    let result;

    if(mode === "borrow"){

      result =
        await borrowBooks(
          member.id,
          items.map(x => x.barcode)
        );

    }else{

      result =
        await returnBooks(
          member.id,
          items.map(x => x.barcode)
        );

    }


    const resultItems =
      result || items.map(x => ({
        title: x.title
      }));


    receiptChoice(resultItems);

  }catch(e){

    alert(e.message);

  }

}


home();

</script>

</body>
</html>
